name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: python
    steps:
      - uses: actions/checkout@v7
      - name: Install deps
        env:
          PIP_INDEX_URL: https://nexus.void42.internal/repository/pypi-proxy/simple/
          PIP_TRUSTED_HOST: nexus.void42.internal
        run: |
          pip install --no-cache-dir --upgrade setuptools wheel
          pip install --no-cache-dir --no-build-isolation -e ".[dev]"
      - name: pytest with coverage
        run: |
          python3 -m pytest tests/ -q \
            --cov=src --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml
      - name: Lint
        run: python3 -m pylint src tests

  build-deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: void42/ci-actions
          path: .ci-actions
          token: ${{ secrets.CI_READ_TOKEN }}
      # The shared action builds, pushes, signs and attests a full-image
      # SBOM (syft plus runtime-bundled libraries) by digest, then checks
      # both artifacts reached the registry. That attestation is what feeds
      # Dependency-Track; the previous inline build signed but never
      # attested, so the running currency service had no SBOM there.
      # Deployment stays manual (currency-service/fontem-currency.yaml).
      - name: Build, push, sign, attest
        uses: ./.ci-actions/actions/docker-build-sign
        with:
          image: contribute.void42.internal/fontem/fontem-currency
          cosign-key: ${{ secrets.COSIGN_KEY }}
          registry-user: ${{ secrets.REGISTRY_USER }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
