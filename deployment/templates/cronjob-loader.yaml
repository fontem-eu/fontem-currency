apiVersion: batch/v1
kind: CronJob
metadata:
  name: fontem-currency-loader
  namespace: {{ .Release.Namespace }}
  labels:
    app: fontem-currency-loader
    component: cron
spec:
  # Daily at 02:30 UTC — ECB publishes the day's reference rate around
  # 16:00 CET on each business day; running early the next day gives
  # the previous day's rate plenty of time to land.
  schedule: {{ .Values.loader.schedule | default "30 2 * * *" | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ .Values.loader.deadlineSeconds | default 1800 }}
      backoffLimit: 1
      template:
        metadata:
          annotations:
            # Batch Job: don't inject the linkerd sidecar. It never exits when
            # the loader finishes, so the Job hangs to activeDeadlineSeconds
            # and is marked Failed even though the load succeeded.
            linkerd.io/inject: "disabled"
          labels:
            app: fontem-currency-loader
            component: cron
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ .Values.runAsUser | default 999 }}
            runAsGroup: {{ .Values.runAsUser | default 999 }}
          imagePullSecrets:
            - name: regcred
          volumes:
            - name: rates
              persistentVolumeClaim:
                claimName: fontem-currency-rates
          containers:
            - name: loader
              image: contribute.void42.internal/fontem/fontem-currency:{{ .Values.version }}
              # The API notices new rates on disk by itself (it re-checks
              # metadata.json every RELOAD_CHECK_SECONDS), so the loader only
              # loads: no reload ping, and no shell for one (the image has
              # none). The old curl calls never ran either: the previous
              # image had no curl.
              command: ["python", "-m", "src.loader.load"]
              env:
                - name: CURRENCY_DATA_DIR
                  value: /srv/currency-data
              volumeMounts:
                - name: rates
                  mountPath: /srv/currency-data
              resources:
                requests: {cpu: 100m, memory: 256Mi}
                limits:   {cpu: 1,    memory: 1Gi}
