[project]
name = "fontem-currency"
version = "0.1.0"
description = "Currency reference + EUR conversion service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.125.0",
    "uvicorn>=0.32.1",
    "httpx>=0.27",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "pylint>=4.0.7",
    "httpx>=0.27.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.data" = ["*.json"]

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "fixme",
    # Per-module headers + the inline comments do the explaining;
    # forcing a docstring on every helper produces redundant noise.
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
